<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CorpNet — Internal Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 40px;
      width: 360px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 22px;
      color: #222;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 12px;
      color: #999;
      margin-bottom: 28px;
    }

    .alert {
      background: #fff3f3;
      border: 1px solid #ffcccc;
      color: #cc0000;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .alert.show { display: block; }

    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-bottom: 5px;
      margin-top: 14px;
    }

    input {
      width: 100%;
      border: 1px solid #ccc;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: #0066cc; }

    .btn {
      width: 100%;
      background: #0066cc;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn:hover { background: #0055aa; }

    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
    }

    .links a {
      font-size: 12px;
      color: #0066cc;
      text-decoration: none;
    }

    .links a:hover { text-decoration: underline; }

    .admin { display: none; text-align: center; }
    .admin.show { display: block; }
    .login-form.hide { display: none; }

    .admin h2 { color: #008800; font-size: 20px; margin-bottom: 8px; }
    .admin p { color: #555; font-size: 13px; margin-bottom: 24px; }

    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .data-row:last-child { border: none; }
    .key { color: #999; }
    .val { color: #222; font-weight: bold; }
    .val.green { color: #008800; }
    .val.red { color: #cc0000; }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #bbb;
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="login-form" id="loginForm">
      <h1>CorpNet Portal</h1>
      <div class="subtitle">Authorized access only</div>

      <div class="alert" id="errorAlert">Invalid username or password.</div>

      <label>Username</label>
      <input type="text" id="username" placeholder="username" autocomplete="off"/>

      <label>Password</label>
      <input type="password" id="password" placeholder="password"/>

      <button class="btn" onclick="handleLogin()">Sign In</button>

      <div class="links">
        <a href="/admin">Admin Panel</a>
        <a href="/backup">Backup</a>
        <a href="/.env">Config</a>
        <a href="/phpmyadmin">Database</a>
      </div>
    </div>

    <div class="admin" id="adminPanel">
      <h2>✓ Access Granted</h2>
      <p>Welcome, Administrator</p>

      <div class="data-row">
        <span class="key">Session ID</span>
        <span class="val green" id="sessionId">—</span>
      </div>
      <div class="data-row">
        <span class="key">Clearance</span>
        <span class="val green">Level 5 — Full</span>
      </div>
      <div class="data-row">
        <span class="key">Last Login</span>
        <span class="val" id="lastLogin">—</span>
      </div>
      <div class="data-row">
        <span class="key">Active Users</span>
        <span class="val">3</span>
      </div>
      <div class="data-row">
        <span class="key">Threat Level</span>
        <span class="val red">Elevated</span>
      </div>
    </div>

    <div class="footer">CorpNet v2.4.1 — Internal use only</div>
  </div>

  <script>
    // Weak credentials — intentional for lab testing
    const CREDENTIALS = {
      "admin": "admin123",
      "administrator": "password",
      "root": "toor",
      "user": "user123"
    };

    function handleLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const alert = document.getElementById('errorAlert');

      if (CREDENTIALS[user] && CREDENTIALS[user] === pass) {
        document.getElementById('loginForm').classList.add('hide');
        document.getElementById('adminPanel').classList.add('show');
        document.getElementById('sessionId').textContent = Math.random().toString(36).substr(2,16).toUpperCase();
        document.getElementById('lastLogin').textContent = new Date().toLocaleString();
      } else {
        alert.classList.add('show');
        document.getElementById('password').value = '';
        setTimeout(() => alert.classList.remove('show'), 3000);
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>

</body>
</html>
